<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goodwill Cloud Accounting</title>
<meta name="theme-color" content="#0a0b09">
<link rel="manifest" href="money-manifest.json">
<link rel="icon" href="money-icon-192.png">
<link rel="apple-touch-icon" href="money-icon-192.png">
<style>
:root{--bg:#0a0b09;--s:#14160f;--s2:#1f2418;--g:#9fe870;--t:#f2f5ef;--m:#8b948a;--r:#ff8a7a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px;font-weight:800}header b span{color:var(--g)}
header button{background:none;border:0;font-size:24px;color:var(--m);cursor:pointer}
main{padding:0 16px 120px;max-width:520px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--s);border-radius:24px;padding:18px;text-align:center}
.card small{color:var(--m);font-size:14px}
.left{font-size:40px;font-weight:800;margin:4px 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--s2);border-radius:16px;padding:10px;font-size:13px;color:var(--m)}.mini b{display:block;font-size:20px;margin-top:2px}
.in b,.in{color:var(--g)}.out b,.out{color:var(--r)}
.big{border:0;border-radius:28px;padding:28px 8px;font-size:22px;font-weight:800;cursor:pointer;margin-top:14px}
.big.in{background:var(--g);color:#0a0b09}.big.out{background:var(--r);color:#0a0b09}
.btn{display:block;width:100%;border:0;border-radius:24px;padding:16px;font-weight:700;font-size:18px;background:var(--g);color:#0a0b09;margin-top:14px;cursor:pointer}
.btn.alt{background:var(--s2);color:var(--t)}
h2{font-size:26px;margin:6px 0 10px}
h3{font-size:14px;color:var(--m);margin:22px 0 8px;font-weight:600}
.back{background:none;border:0;color:var(--m);font-size:16px;padding:6px 0;cursor:pointer}
input{width:100%;background:var(--s);color:var(--t);border:2px solid var(--s2);border-radius:18px;padding:14px;font-size:18px;font:inherit;font-size:18px}
#am{font-size:38px;font-weight:800;text-align:center;padding:18px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.chip{background:var(--s);border:2px solid var(--s2);border-radius:20px;padding:16px 6px;font-size:17px;font-weight:600;color:var(--t);cursor:pointer;text-align:center}
.chip i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}
.chip.on{border-color:var(--g);background:var(--s2)}
.seg{display:flex;gap:10px;margin:10px 0}.seg .chip{flex:1;padding:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--s);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.row .e{font-size:26px}.row .w{flex:1;font-size:16px;font-weight:600}.row .w small{display:block;color:var(--m);font-weight:400;font-size:12px}
.row .a{font-weight:800;font-size:17px}.row .x{background:none;border:0;color:var(--m);font-size:18px;cursor:pointer;padding:4px}
.mu{color:var(--m);text-align:center;margin:30px 0;font-size:16px}
label{display:block;font-size:14px;color:var(--m);margin:14px 0 6px}
.paper{background:#fff;color:#111;border-radius:6px;padding:14px 8px;margin-top:12px;font-size:12px}
.paper .ph{text-align:center;margin-bottom:10px;line-height:1.5}.paper .ph b{font-size:16px;letter-spacing:1px}.paper .ph span{color:#555}
table.p{width:100%;border-collapse:collapse}table.p th{text-align:right;border-bottom:2px solid #111;padding:5px 3px;font-size:11px}table.p th:nth-child(-n+2){text-align:left}
table.p td{padding:5px 3px;border-bottom:1px solid #ddd;text-align:right;vertical-align:top}table.p td:nth-child(-n+2){text-align:left}
table.p td small{display:block;color:#666;font-size:10px}.gi{color:#0a7a2f}.ro{color:#b3261e}
table.p tr.dbt td{color:#888;font-style:italic}
table.p tr.dt td{background:#eee;font-weight:700;border-bottom:2px solid #bbb}table.p tr.tt td{font-weight:800;border-top:2px solid #111;font-size:13px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.three .btn{font-size:14px;padding:12px 4px}.three i{display:block;font-style:normal;font-size:24px;margin-bottom:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--s);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--s2);z-index:9}
nav button{flex:1;background:none;border:0;color:var(--m);font-size:12px;font-weight:600;padding:6px 0;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:24px;margin-bottom:2px}nav button.on{color:var(--g)}
.del{background:var(--s2);color:var(--r);border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}.del.sure{background:var(--r);color:#0a0b09}
select.wfs{width:100%;background:var(--s);color:var(--t);border:2px solid var(--s2);border-radius:18px;padding:17px 14px;font:inherit;font-size:19px;font-weight:600;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--g) 50%),linear-gradient(135deg,var(--g) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select.wfs option{background:#14160f;color:#f2f5ef}
#chips .chip{position:relative;padding:26px 4px 12px;font-size:14px;min-height:98px;word-break:break-word}
#chips .chip i{font-size:26px;margin-bottom:6px}
.cb{position:absolute;top:8px;right:8px;width:22px;height:22px;border:2px solid var(--m);border-radius:7px}
.chip.on .cb{background:var(--g);border-color:var(--g)}
.chip.on .cb::after{content:"\2713";display:block;color:#0a0b09;font-weight:900;font-size:15px;line-height:18px;text-align:center}
.sh{font-size:19px;font-weight:800;margin:26px 0 10px}
.edt{background:var(--s2);color:var(--t);border:0;border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer}
.paid{background:var(--g);color:#0a0b09;border:0;border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.bar{height:10px;border-radius:5px;background:var(--r);margin-top:5px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--g);color:#0a0b09;padding:12px 20px;border-radius:22px;font-weight:700;font-size:16px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>

<main>

<section id="home" class="on">
  <div class="card"><small>Left this month</small><div class="left" id="left"></div>
    <div class="two"><div class="mini in">&#11015; IN<b id="tin"></b></div><div class="mini out">&#11014; OUT<b id="tout"></b></div></div></div>
  <div class="two"><button class="big in" id="bin">&#65291;<br>Money IN</button><button class="big out" id="bout">&#65293;<br>Money OUT</button></div>
</section>

<section id="add">
  <button class="back" id="back">&#8592; Back</button>
  <h2 id="at"></h2>
  <input id="am" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
  <label>What for?</label><select id="wf" class="wfs"></select>
  <label>Note (if you want)</label><input id="nt" placeholder="">
  <div class="chips" id="mt"></div><div id="mh" class="in" style="text-align:center;font-size:14px;margin-bottom:6px"></div>
  <label>Date</label><input type="date" id="dt">
  <button class="btn" id="save">&#10003; SAVE</button>
</section>

<section id="rep">
  <input type="month" id="rm">
  <div class="paper" id="paper"></div>
  <button class="btn" id="rsend">&#128228; Send to accountant</button>
  <button class="btn alt" id="rpdf">&#11015; Download A4 PDF</button>
</section>

<section id="dsh">
  <h2>Dashboard</h2>
  <div id="dcards"></div>
  <div class="card" style="margin-top:10px"><small>Last 6 months &nbsp;<span class="in">&#9632; IN</span> &nbsp;<span class="out">&#9632; OUT</span></small>
    <svg id="dchart" viewBox="0 0 320 125" width="100%" style="margin-top:8px"></svg></div>
  <h3>Where the money went (this month)</h3><div class="card" id="dtop" style="text-align:left"></div>
</section>

<section id="mk">
  <h2>Create</h2>
  <div class="sh">&#128179; Ways to pay</div><div id="ml"></div><div class="chips" id="msug"></div>
  <div class="two"><input id="mn" placeholder="Add a new way"><button class="btn" id="madd" style="margin:0">Add</button></div>
  <div class="sh in">&#11015; What for: Money IN</div><div id="cl-I"></div><div class="chips" id="cs-I"></div>
  <div class="two"><input id="cn-I" placeholder="Add a new one"><button class="btn" id="ca-I" style="margin:0">Add</button></div>
  <div class="sh out">&#11014; What for: Money OUT</div><div id="cl-O"></div><div class="chips" id="cs-O"></div>
  <div class="two"><input id="cn-O" placeholder="Add a new one"><button class="btn" id="ca-O" style="margin:0">Add</button></div>
</section>

<section id="ent">
  <h2>Entries</h2>
  <input type="month" id="em">
  <div id="el" style="margin-top:12px"></div>
</section>

<section id="set">
  <button class="back" id="back2">&#8592; Back</button>
  <h2>Settings</h2>
  <label>Shop / business name</label><input id="biz">
  <label>Money name (KD, Rs, ...)</label><input id="cur">
</section>

</main>
<nav id="nav">
  <button data-s="home" class="on"><i>&#127968;</i>Home</button>
  <button data-s="dsh"><i>&#128202;</i>Dashboard</button>
  <button data-s="rep"><i>&#128196;</i>Report</button>
  <button data-s="ent"><i>&#128203;</i>Entries</button>
  <button data-s="mk"><i>&#10133;</i>Create</button>
</nav>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K="goodwill.money.v1";let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{biz:"My Shop",cur:"KD",ent:[]};
D.methods=D.methods||[{id:"C",n:"Cash",e:"\u{1F4B5}"},{id:"B",n:"Bank",e:"\u{1F3E6}"},{id:"D",n:"Debt",e:"\u{1F4DD}"}];
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const CH={I:[["\u{1F4B0}","Sales"],["\u{1F9FE}","Payment received"]],
  O:[["\u26FD","Fuel"],["\u{1F37D}","Food"],["\u{1F477}","Salary"],["\u{1F3E0}","Rent"],["\u{1F4A1}","Bills"],["\u{1F6D2}","Goods"],["\u{1F527}","Repair"]]};
D.cats=D.cats||{I:CH.I.map(c=>({e:c[0],n:c[1]})),O:CH.O.map(c=>({e:c[0],n:c[1]}))};
if(!D.noOther){["I","O"].forEach(t=>D.cats[t]=D.cats[t].filter(c=>c.n!=="Other"));D.noOther=1;sv()}
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),td=()=>iso(new Date());
const fm=n=>(+n).toLocaleString("en",{maximumFractionDigits:3});
const h=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)};
const MI={knet:"\u{1F4B3}",gpay:"\u{1F4F1}",phonepe:"\u{1F4F1}","wamd pay":"\u{1F4F1}"};
const mname=id=>(D.methods.find(m=>m.id===id)||{n:"Other"}).n;
function addM(n){let m=D.methods.find(x=>x.n.toLowerCase()===n.toLowerCase());if(!m){m={id:"m"+Date.now()+Math.random().toString(36).slice(2,6),n,e:MI[n.toLowerCase()]||"\u{1F4B3}"};D.methods.push(m);sv()}return m.id}
function mchips(){$("#mt").innerHTML=D.methods.map(m=>`<button class="chip${m.id===H?" on":""}" data-h="${m.id}"><i>${m.e}</i>${h(m.n)}</button>`).join("");
  $("#mh").textContent=H==="D"?(T==="I"?"Customer will pay later":"You will pay later"):""}
const emo=(t,w)=>((D.cats[t].find(c=>c.n===w)||{}).e)||"🏷️";
const CE={water:"💧",phone:"📞",mobile:"📞",transport:"🚕",taxi:"🚕",tax:"🧾",medicine:"💊",electricity:"💡",light:"💡",loan:"🏦",refund:"↩️",packing:"📦",rent:"🏠",food:"🍽",fuel:"⛽",salary:"👷",internet:"🌐",insurance:"🛡️"};
const SUG={I:["Loan","Refund","Rent received"],O:["Water","Phone","Transport","Tax","Medicine","Internet"]};
function addC(t,n){if(D.cats[t].some(c=>c.n.toLowerCase()===n.toLowerCase()))return;const it={n,e:CE[n.toLowerCase()]||"🏷️"},i=D.cats[t].findIndex(c=>c.n==="Other");i<0?D.cats[t].push(it):D.cats[t].splice(i,0,it);sv()}
function csett(){["I","O"].forEach(t=>{
  $("#cl-"+t).innerHTML=D.cats[t].map(c=>`<div class="row"><span class="e">${c.e}</span><div class="w">${h(c.n)}</div><button class="del" data-rc="${h(c.n)}" data-t="${t}">Delete</button></div>`).join("");
  $("#cs-"+t).innerHTML=SUG[t].filter(n=>!D.cats[t].some(c=>c.n.toLowerCase()===n.toLowerCase())).map(n=>`<button class="chip" data-sc="${h(n)}" data-t="${t}"><i>${CE[n.toLowerCase()]||"🏷️"}</i>${h(n)}</button>`).join("")})}
let T="I",W="",H="C",EDIT=null;
function go(s){$$("section").forEach(x=>x.classList.toggle("on",x.id===s));$("#nav").style.display=["home","dsh","rep","ent","mk"].includes(s)?"flex":"none";$$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));scrollTo(0,0)}

function home(){
  const mo=td().slice(0,7),L=D.ent.filter(e=>e.d.startsWith(mo)&&e.h!=="D"),i=L.filter(e=>e.t==="I").reduce((s,e)=>s+e.a,0),o=L.filter(e=>e.t==="O").reduce((s,e)=>s+e.a,0);
  $("#left").textContent=D.cur+" "+fm(i-o);$("#left").className="left "+(i-o<0?"out":"in");$("#tin").textContent=fm(i);$("#tout").textContent=fm(o);}
function open_(t){EDIT=null;$("#save").innerHTML="&#10003; SAVE";T=t;W="";H="C";$("#at").textContent=t==="I"?"Money IN":"Money OUT";$("#at").className=t==="I"?"in":"out";
  $("#am").value="";$("#nt").value="";$("#dt").value=td();
  $("#wf").innerHTML='<option value="">Tap to choose...</option>'+D.cats[t].map(c=>`<option value="${h(c.n)}">${c.e} ${h(c.n)}</option>`).join("");$("#wf").value="";
  mchips();go("add");setTimeout(()=>$("#am").focus(),100)}
$("#bin").onclick=()=>open_("I");$("#bout").onclick=()=>open_("O");
$("#wf").onchange=()=>{W=$("#wf").value};
$("#mt").onclick=ev=>{const b=ev.target.closest(".chip");if(!b)return;if(b.dataset.new){const n=(prompt("Name? (KNET, GPay, PhonePe...)")||"").trim();if(n)H=addM(n)}else H=b.dataset.h;mchips()};
$("#save").onclick=()=>{const a=parseFloat($("#am").value);
  if(!(a>0))return toast("Type the amount");if(!W)return toast("Tap what it was for");
  const o={d:$("#dt").value||td(),t:T,a,w:W,n:$("#nt").value.trim(),h:H};
  if(EDIT){const e=D.ent.find(x=>x.id===EDIT),paid=D.ent.filter(x=>x.ref===e.id).reduce((s,x)=>s+x.a,0);
    if(paid>0&&(H!=="D"||a<paid-0.0005))return toast(H!=="D"?"This debt has payments. Delete them first":"Less than already paid ("+fm(paid)+")");
    Object.assign(e,o);sv();EDIT=null;toast("Updated \u2713");ents();go("ent");return}
  D.ent.push({id:Date.now(),...o});sv();toast("Saved \u2713");home();go("home")};
$("#back2").onclick=()=>{home();go("home")};

function msett(){
  $("#ml").innerHTML=D.methods.map(m=>`<div class="row"><span class="e">${m.e}</span><div class="w">${h(m.n)}</div>${["C","B","D"].includes(m.id)?"":`<button class="del" data-rm="${m.id}">Delete</button>`}</div>`).join("");

$("#ml").onclick=ev=>{const b=ev.target.closest("[data-rm]");if(!b)return;

["I","O"].forEach(t=>{

$("#biz").oninput=()=>{D.biz=$("#biz").value.trim()||"My Shop";sv()};$("#cur").oninput=()=>{D.cur=$("#cur").value.trim();sv()};

const build=mo=>{const L=D.ent.filter(e=>e.d.startsWith(mo)).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id),days=[];
  L.forEach(e=>{let d=days[days.length-1];if(!d||d.d!==e.d){d={d:e.d,es:[],i:0,o:0};days.push(d)}d.es.push(e);if(e.h!=="D"){if(e.t==="I")d.i+=e.a;else d.o+=e.a}});
  return{L,days,i:days.reduce((s,d)=>s+d.i,0),o:days.reduce((s,d)=>s+d.o,0)}};
function plines(mo){const R=build(mo),P=(s,n)=>String(s).slice(0,n).padEnd(n),Q=(s,n)=>String(s).padStart(n);
  const o=["GOODWILL CLOUD ACCOUNTING",D.biz,"Money report - Month: "+mo+"    Money: "+D.cur,"",P("DATE",10)+"  "+P("WHAT",24)+"  "+Q("IN",12)+"  "+Q("OUT",12)+"  "+Q("LEFT",12),"-".repeat(78)];let run=0,hasD=false;
  R.days.forEach(d=>{d.es.forEach(e=>{const db=e.h==="D";if(db)hasD=true;else run+=e.t==="I"?e.a:-e.a;
      o.push(P(e.d,10)+"  "+P(e.w+(e.n?" - "+e.n:"")+(e.h!=="C"?" ("+mname(e.h)+")":""),24)+"  "+Q(e.t==="I"?fm(e.a):"",12)+"  "+Q(e.t==="O"?fm(e.a):"",12)+"  "+Q(db?"":fm(run),12))});
    o.push(P("",10)+"  "+P("Day total",24)+"  "+Q(fm(d.i),12)+"  "+Q(fm(d.o),12),"")});
  o.push("-".repeat(78),P("TOTAL",36)+"  "+Q(fm(R.i),12)+"  "+Q(fm(R.o),12)+"  "+Q(fm(R.i-R.o),12));
  if(hasD)o.push("","Rows marked (Debt) are not paid yet and are not counted in the totals.");return o}
function mkPdf(L){const esc=s=>s.replace(/[^\x20-\x7E]/g,"?").replace(/([\\()])/g,"\\$1"),per=62,pg=[];
  for(let i=0;i<L.length;i+=per)pg.push(L.slice(i,i+per));if(!pg.length)pg.push([""]);
  const o=[];o[1]="<</Type/Catalog/Pages 2 0 R>>";o[2]="<</Type/Pages/Kids["+pg.map((_,i)=>(5+i*2)+" 0 R").join(" ")+"]/Count "+pg.length+">>";o[3]="<</Type/Font/Subtype/Type1/BaseFont/Courier>>";
  pg.forEach((p,i)=>{const t="BT /F1 9 Tf 12 TL 40 800 Td "+p.map(l=>"("+esc(l)+") Tj T*").join(" ")+" ET";o[4+i*2]="<</Length "+t.length+">>\nstream\n"+t+"\nendstream";o[5+i*2]="<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Contents "+(4+i*2)+" 0 R/Resources<</Font<</F1 3 0 R>>>>>>"});
  let out="%PDF-1.4\n";const off=[];for(let n=1;n<o.length;n++){off[n]=out.length;out+=n+" 0 obj\n"+o[n]+"\nendobj\n"}const x=out.length;
  out+="xref\n0 "+o.length+"\n0000000000 65535 f \n"+off.slice(1).map(v=>String(v).padStart(10,"0")+" 00000 n \n").join("")+"trailer\n<</Size "+o.length+"/Root 1 0 R>>\nstartxref\n"+x+"\n%%EOF";return new Blob([out],{type:"application/pdf"})}
function dl(b,n){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const pdfOf=mo=>mkPdf(plines(mo));
async function send(mo){
  const R=build(mo),A=R.L;if(!A.length)return toast("Nothing to send yet");
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[["DATE","WHAT","NOTE","MONEY IN","MONEY OUT","HOW"]].concat(A.map(e=>[e.d,e.w,e.n,e.t==="I"?e.a:"",e.t==="O"?e.a:"",mname(e.h)]),[["","TOTAL (Debt rows not counted)","",R.i,R.o,""]]);
  const pdf=new File([pdfOf(mo)],"money-report-"+mo+".pdf",{type:"application/pdf"}),csv=new File(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],"money-"+mo+".csv",{type:"text/csv"});
  const msg=D.biz+" - "+mo+": IN "+D.cur+" "+fm(R.i)+", OUT "+D.cur+" "+fm(R.o)+", LEFT "+D.cur+" "+fm(R.i-R.o);
  if(navigator.canShare&&navigator.canShare({files:[pdf,csv]})){try{await navigator.share({files:[pdf,csv],title:D.biz,text:msg});return}catch(e){if(e.name==="AbortError")return}}
  dl(pdf,pdf.name);toast("Report saved. Send it on WhatsApp.");setTimeout(()=>open("https://wa.me/96555320621?text="+encodeURIComponent(msg),"_blank"),1200)}
function report(){const mo=$("#rm").value||td().slice(0,7),R=build(mo),[y,m]=mo.split("-");let run=0,hasD=false;
  const nm=new Date(+y,+m-1,1).toLocaleString("en",{month:"long",year:"numeric"});
  $("#paper").innerHTML=`<div class="ph"><b>GOODWILL CLOUD ACCOUNTING</b><br>${h(D.biz)}<br><span>Money report &middot; ${nm} &middot; ${h(D.cur)}</span></div>`+(R.L.length?`<table class="p"><tr><th>Date</th><th>What</th><th>IN</th><th>OUT</th><th>Left</th></tr>`+
   R.days.map(d=>d.es.map(e=>{const db=e.h==="D";if(db)hasD=true;else run+=e.t==="I"?e.a:-e.a;return `<tr class="${db?"dbt":""}"><td>${e.d.slice(5)}</td><td>${h(e.w)}${e.n||e.h!=="C"?"<small>"+h([e.n,e.h!=="C"?mname(e.h):""].filter(Boolean).join(" \u00b7 "))+"</small>":""}</td><td class="gi">${e.t==="I"?fm(e.a):""}</td><td class="ro">${e.t==="O"?fm(e.a):""}</td><td>${db?"":fm(run)}</td></tr>`}).join("")+`<tr class="dt"><td colspan="2">Day total</td><td class="gi">${fm(d.i)}</td><td class="ro">${fm(d.o)}</td><td></td></tr>`).join("")+
   `<tr class="tt"><td colspan="2">TOTAL</td><td class="gi">${fm(R.i)}</td><td class="ro">${fm(R.o)}</td><td>${fm(R.i-R.o)}</td></tr></table>`+(hasD?'<p style="margin-top:8px;font-size:11px;color:#666">Grey rows are Debt (not paid yet). They are not counted in the totals.</p>':""):'<p style="text-align:center;margin:30px 0;color:#666">Nothing in this month.</p>')}
$("#rm").onchange=report;
$("#rsend").onclick=()=>send($("#rm").value||td().slice(0,7));
$("#rpdf").onclick=()=>{const mo=$("#rm").value||td().slice(0,7);dl(pdfOf(mo),"money-report-"+mo+".pdf");toast("PDF downloaded")};
const sm=L=>{L=L.filter(e=>e.h!=="D");return{i:L.filter(e=>e.t==="I").reduce((s,e)=>s+e.a,0),o:L.filter(e=>e.t==="O").reduce((s,e)=>s+e.a,0)}};
function dash(){
  const t=td(),mo=t.slice(0,7),a=sm(D.ent.filter(e=>e.d===t)),m=sm(D.ent.filter(e=>e.d.startsWith(mo))),box=(x)=>`<div class="two" style="margin-top:8px"><div class="mini in">&#11015; IN<b>${fm(x.i)}</b></div><div class="mini out">&#11014; OUT<b>${fm(x.o)}</b></div></div>`;
  $("#dcards").innerHTML=`<div class="card"><small>Today</small>${box(a)}</div><div class="card" style="margin-top:10px"><small>This month</small>${box(m)}<small style="display:block;margin-top:12px">Left</small><div class="left ${m.i-m.o<0?"out":"in"}" style="margin:0;font-size:32px">${D.cur} ${fm(m.i-m.o)}</div></div>`;
  const now=new Date(),bars=[];
  for(let k=5;k>=0;k--){const dt=new Date(now.getFullYear(),now.getMonth()-k,1),key=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"),r=sm(D.ent.filter(e=>e.d.startsWith(key)));bars.push({l:dt.toLocaleString("en",{month:"short"}),i:r.i,o:r.o})}
  const mx=Math.max(1,...bars.map(b=>Math.max(b.i,b.o)));
  $("#dchart").innerHTML=bars.map((b,k)=>{const x0=k*52+10,p=b.i/mx*90,q=b.o/mx*90;return `<rect x="${x0}" y="${100-p}" width="18" height="${p}" rx="3" fill="#9fe870"/><rect x="${x0+20}" y="${100-q}" width="18" height="${q}" rx="3" fill="#ff8a7a"/><text x="${x0+19}" y="118" text-anchor="middle" fill="#8b948a" font-size="11">${b.l}</text>`}).join("");
  const g={};D.ent.filter(e=>e.t==="O"&&e.h!=="D"&&e.d.startsWith(mo)).forEach(e=>g[e.w]=(g[e.w]||0)+e.a);
  const top=Object.entries(g).sort((x,y)=>y[1]-x[1]).slice(0,5),mxo=top.length?top[0][1]:1;
  $("#dtop").innerHTML=top.length?top.map(x=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:16px"><span>${emo("O",x[0])} ${h(x[0])}</span><b>${fm(x[1])}</b></div><div class="bar" style="width:${x[1]/mxo*100}%"></div></div>`).join(""):'<p class="mu" style="margin:10px">No money out this month.</p>'}
$$("#nav button").forEach(b=>b.onclick=()=>{const s=b.dataset.s;if(s==="home")home();if(s==="dsh")dash();if(s==="rep"){if(!$("#rm").value)$("#rm").value=td().slice(0,7);report()}if(s==="mk"){msett();csett()}if(s==="ent")ents();go(s)});

  const mo=$("#em").value,L=D.ent.filter(e=>e.d.startsWith(mo)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  $("#el").innerHTML=L.length?L.map(e=>`<div class="row" style="flex-wrap:wrap"><span class="e">${emo(e.t,e.w)}</span><div class="w">${h(e.w)}<small>${e.d.slice(5)}${e.n?" &middot; "+h(e.n):""}${e.h!=="C"?" &middot; "+h(mname(e.h)):""}</small></div><span class="a ${e.t==="I"?"in":"out"}">${e.t==="I"?"+":"\u2212"}${fm(e.a)}</span><div style="width:100%;display:flex;gap:8px;margin-top:6px"><button class="edt" data-ed="${e.id}">Edit</button><button class="del" data-dl="${e.id}">Delete</button></div></div>`).join(""):'<p class="mu">Nothing in this month.</p>'}

if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("money-sw.js").catch(()=>{});
home();
